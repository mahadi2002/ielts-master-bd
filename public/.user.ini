; cPanel per-directory PHP settings — locks down what shared hosting leaves open by default.
; disable_functions usually cannot be set here on shared hosting — ask the host
; to apply it, or set it in php.ini on a VPS:
;   disable_functions=exec,passthru,shell_exec,system,proc_open,popen,curl_multi_exec,parse_ini_file,show_source

display_errors = Off
log_errors = On
expose_php = Off
allow_url_fopen = Off
allow_url_include = Off
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
upload_max_filesize = 1M
post_max_size = 2M
max_execution_time = 30
